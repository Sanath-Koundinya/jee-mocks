<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>JEE Mock Test</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f7f9fb; }
    .question { background: #fff; border-left: 5px solid #007acc; margin: 20px 0; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .options label { display: block; margin: 5px 0; }
    button { margin-top: 20px; padding: 10px 15px; font-weight: bold; }
  </style>
  <script type="text/javascript"
    async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
  </script>
</head>
<body>

  <h1>JEE Mock Test – Demo</h1>

  <form id="quizForm">

    <div class="question">
      <p><strong>Q1:</strong> Evaluate the integral: \( \int_0^1 x^2 \, dx \)</p>
      <div class="options">
        <label><input type="radio" name="q1" value="0"> 0</label>
        <label><input type="radio" name="q1" value="1/3"> \( \frac{1}{3} \)</label>
        <label><input type="radio" name="q1" value="1/2"> \( \frac{1}{2} \)</label>
        <label><input type="radio" name="q1" value="1"> 1</label>
      </div>
    </div>

    <div class="question">
      <p><strong>Q2:</strong> The vector \( \vec{A} = 3\hat{i} + 4\hat{j} \). What is \( |\vec{A}| \)?</p>
      <div class="options">
        <label><input type="radio" name="q2" value="5"> 5</label>
        <label><input type="radio" name="q2" value="7"> 7</label>
        <label><input type="radio" name="q2" value="12"> 12</label>
        <label><input type="radio" name="q2" value="25"> 25</label>
      </div>
    </div>

    <div class="question">
      <p><strong>Q3:</strong> Which of the following are prime numbers?</p>
      <div class="options">
        <label><input type="checkbox" name="q3" value="2"> 2</label>
        <label><input type="checkbox" name="q3" value="4"> 4</label>
        <label><input type="checkbox" name="q3" value="5"> 5</label>
        <label><input type="checkbox" name="q3" value="9"> 9</label>
      </div>
    </div>

    <button type="button" onclick="submitQuiz()">Submit</button>
    <p id="result"></p>

  </form>

  <script>
    function submitQuiz() {
      let score = 0;

      // Q1: Correct = 1/3
      if (document.querySelector('input[name="q1"]:checked')?.value === "1/3") {
        score += 3;
      }

      // Q2: Correct = 5
      if (document.querySelector('input[name="q2"]:checked')?.value === "5") {
        score += 3;
      }

      // Q3: Correct = 2 and 5 only
      const q3Answers = Array.from(document.querySelectorAll('input[name="q3"]:checked')).map(el => el.value);
      const correctQ3 = ["2", "5"];
      if (q3Answers.length === 2 && q3Answers.every(val => correctQ3.includes(val))) {
        score += 3;
      }

      document.getElementById("result").innerText = `Your Score: ${score} / 9`;
    }
  </script>

</body>
</html>
